server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /srv/portal;
    index index.html;
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # 云笺集博客（Fuwari 静态站）: /dev/
    location /dev/ {
        alias /srv/fuwari/dist/;
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # 写作空间 SPA（§3.2 /dev/write/）
    location /dev/write/ {
        alias /srv/cloudletter/write/;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /dev/write/index.html;
    }

    # 设置控制台 SPA（§3.2 /dev/console/）
    location /dev/console/ {
        alias /srv/cloudletter/console/;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /dev/console/index.html;
    }

    # 新 Node 服务 API（§3.2：/api/ 仅经反代暴露，不直连）
    location /api/ {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # 已下线的旧链接，跳回导航首页
    location /arcade/ { return 301 /; }
    location /arcade { return 301 /; }
}
