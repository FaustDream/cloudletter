# 云笺集 · 生产 nginx 站点配置（版本化于 server/deploy/，部署流水线会覆盖服务器上的副本）
#
# 架构（2026-08-31 单体覆盖部署后）：
#   - 静态产物：/srv/cloudletter/workbench（apps/workbench 构建产物，React SPA + BrowserRouter，站点根）
#   - API：     /api/* → 127.0.0.1:3012（systemd 单元 cloudletter-server）
#   - 导航页：  /portal/* → /srv/portal（「拾光集」导航页保留，旧根入口路由已迁移）
# 部署：cp server/deploy/nginx-cloudletter.conf /etc/nginx/sites-enabled/arcade && nginx -t && systemctl reload nginx
#
# 安全基线：登录/API 必须走 HTTPS，明文 HTTP 一律重定向 443（参考下方 443 模板；用 certbot 签发证书）。
# 注意：旧 Fuwari 博客(/dev/)、旧在线编辑(/dev/admin/) 已于 2026-08-31 下线（源码/数据仍备份于 /srv/backup-20260831）。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 上传图片直传上限（服务端 POST /uploads 自限 12mb，这里放宽到 14m 留余量）
    client_max_body_size 14m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 静态产物（SPA，站点根 = 云笺集工作台）
    root /srv/cloudletter/workbench;
    index index.html;

    # 带内容哈希的构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 导航页「拾光集」：保留在 /portal/（原根入口迁移至此）
    location ^~ /portal/ {
        alias /srv/portal/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # SPA 路由兜底（BrowserRouter：/posts/:id/edit 等路径直接刷新不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头（与 server 端手写安全头互补）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}

