# 云笺集 · 生产 nginx 站点配置（版本化于 server/deploy/，部署流水线会覆盖服务器上的副本）
#
# 架构（2026-08-29 单体收敛后）：
#   - 静态产物：/srv/cloudletter/workbench（apps/workbench 构建产物，React SPA + BrowserRouter）
#   - API：     /api/* → 127.0.0.1:3012（systemd 单元 cloudletter-server）
# 部署：cp server/deploy/nginx-cloudletter.conf /etc/nginx/conf.d/cloudletter.conf && nginx -t && systemctl reload nginx
#
# 安全基线：登录/API 必须走 HTTPS，明文 HTTP 一律重定向 443（参考 443 块；用 certbot 签发证书）。
# 注意：下方 http 块把 3013/3014 也一并禁了——开发期跨端口访问只在 localhost 直连后端生效。

