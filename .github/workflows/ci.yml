name: Code Review Gate

# 合并前的质量门禁：类型检查 + 单测 + ESLint + 生产构建。
# 与 deploy.yml（部署）解耦：本流程只负责"拦错"，全绿后才允许合并/部署。
on:
  pull_request:
    branches: [master]

# 防止并发跑同一批门禁
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 后端：server ----------
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Install lint tooling (一次性，不提交 lockfile)
        run: pnpm add -D eslint@9 @eslint/js@9 typescript-eslint@8 globals prettier
      - name: Lint
        run: pnpm lint

  # ---------- 前端：apps/workbench（写作空间编辑器与站点设置已并入工作台） ----------
  workbench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workbench
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/workbench/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Install lint tooling
        run: pnpm add -D eslint@9 @eslint/js@9 typescript-eslint@8 globals eslint-plugin-react eslint-plugin-react-hooks prettier
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  # ---------- E2E 脚本（不含浏览器运行，避免阻塞普通 PR） ----------
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Install lint tooling
        run: pnpm add -D eslint@9 @eslint/js@9 typescript-eslint@8 globals prettier
      - name: Lint
        run: pnpm lint
      # 说明：完整 Playwright 浏览器运行较重，放在按需/定时流水线（如 workflow_dispatch 或 nightly），
      # 不在此阻塞每次 PR。需要时可在本地 `pnpm test` 或单独 job 跑。

