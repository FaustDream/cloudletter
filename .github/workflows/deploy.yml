name: Deploy to Server

on:
  push:
    branches: [master]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            apps/workbench/pnpm-lock.yaml

      # ===== 云笺集单体：server + apps/workbench（写作空间编辑器与站点设置已并入工作台；
      # 独立的 apps/write、apps/console 已下线，博客前台更早下线） =====
      - name: Install server dependencies
        working-directory: server
        run: |
          pnpm install --frozen-lockfile
          pnpm db:generate

      - name: Build workbench app
        working-directory: apps/workbench
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Deploy to server
        run: |
          # 打包：server 源码(tsx 直跑) + 工作台构建产物
          tar -czf deploy-v2.tar.gz \
            -C . \
            --exclude='server/node_modules' \
            --exclude='server/data' \
            server/package.json server/pnpm-lock.yaml server/tsconfig.json server/prisma/ server/src/ server/scripts/ server/deploy/ \
            apps/workbench/dist/

          # 上传到服务器（主机指纹由 SSH_KNOWN_HOSTS 校验，不再跳过严格检查）
          scp deploy-v2.tar.gz root@${{ secrets.SERVER_IP }}:/tmp/

          # 远程部署
          ssh root@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            # ===== 云笺集单体部署（/srv/cloudletter） =====
            mkdir -p /srv/cloudletter
            tar -xzf /tmp/deploy-v2.tar.gz -C /srv/cloudletter/
            rm /tmp/deploy-v2.tar.gz

            # server 依赖 + Prisma Client
            cd /srv/cloudletter/server
            pnpm install --frozen-lockfile
            pnpm db:generate

            # 生产环境变量（与 systemd 单元口径一致；本会话非 systemd，必须显式注入，
            # 否则 backup/drop-fts 会默认落到 data/dev，备份不到真实生产数据）
            export NODE_ENV=production
            export DATA_ROOT=/srv/cloudletter/server/data
            export DATABASE_URL=file:/srv/cloudletter/server/data/cloudletter.db
            export POSTS_ROOT=/srv/cloudletter/server/data/posts
            export SETTINGS_ROOT=/srv/cloudletter/server/data/settings

            # ===== 数据无价：先备份再动库结构 =====
            # SQLite + 文章真相源 + 上传资源 → <DATA_ROOT>/backups/<时间戳>/
            pnpm backup

            # db push 前必须先删 FTS 表（post_search 由运行时代码创建，不在 schema 内；
            # 不删则 push 因「表非空要求 drop」必然失败）。服务重启后 initSearchIndex 自动重建并重索引。
            pnpm exec tsx scripts/drop-fts-tables.ts

            # 按 schema.prisma 同步库结构
            # （无 migrations 目录，用 db push；升级到 migrate deploy 前不要手工改库）
            pnpm exec prisma db push --skip-generate

            # 前端产物就位（nginx 指向 /srv/cloudletter/workbench/）
            rm -rf /srv/cloudletter/workbench
            mkdir -p /srv/cloudletter/workbench
            cp -r /srv/cloudletter/apps/workbench/dist/* /srv/cloudletter/workbench/

            # systemd 单元以仓库为准（ExecStart 指向 .bin/tsx 等），更新后重启生效
            cp -f /srv/cloudletter/server/deploy/cloudletter-server.service /etc/systemd/system/cloudletter-server.service
            systemctl daemon-reload

            # nginx 配置以仓库为准：服务器站点文件为 sites-enabled/arcade；清理旧 conf.d 残留防双 server 块
            rm -f /etc/nginx/conf.d/cloudletter.conf
            cp -f /srv/cloudletter/server/deploy/nginx-cloudletter.conf /etc/nginx/sites-enabled/arcade

            # systemd 重启 Node 服务
            systemctl restart cloudletter-server

            # 探活：服务起来才算部署成功
            for i in $(seq 1 15); do
              if curl -fsS http://localhost:3012/healthz > /dev/null; then break; fi
              sleep 1
              if [ "$i" = 15 ]; then echo "healthz 探活失败"; journalctl -u cloudletter-server -n 50 --no-pager; exit 1; fi
            done

            # 重载 nginx（/ 反代静态产物、/api/ 反代 Node 服务）
            nginx -t && systemctl reload nginx

            echo "部署完成"
          EOF
