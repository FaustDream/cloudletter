<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>云笺集 · 双视图时间轴（原型）</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#f4f1ea; --ink:#16233d; --ink-2:#5b6b84; --ink-3:#97a4bb;
  --line:rgba(90,110,150,.14); --line-2:rgba(90,110,150,.24);
  --card:rgba(255,255,255,.72); --card-solid:#fff;
  --accent:#2e6df0; --accent-deep:#1b4fa0; --accent-soft:rgba(46,109,240,.10);
  --ok:#059669; --warn:#d98e2b; --danger:#dc2626; --teal:#0e7490;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
  --shadow-card:0 1px 2px rgba(22,35,61,.04),0 10px 30px -12px rgba(22,35,61,.12);
  --shadow-float:0 14px 44px -14px rgba(16,26,48,.35);
  --radius:14px; --radius-sm:10px; --sidebar-w:228px;
  /* 6 类型色（统一规范：无紫） */
  --t-journal:#185FA5; --t-note:#D97706; --t-plan:#EA580C; --t-checkin:#059669; --t-ledger:#DC2626; --t-goal:#0E7490;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(560px 420px at 82% -6%,rgba(64,140,255,.10),transparent 62%),
    radial-gradient(520px 400px at 8% 108%,rgba(5,150,105,.06),transparent 60%),
    linear-gradient(rgba(90,110,150,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(90,110,150,.045) 1px,transparent 1px);
  background-size:auto,auto,44px 44px,44px 44px;}

.app{display:flex;min-height:100vh}

/* ---- 侧栏（沿用） ---- */
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);position:sticky;top:0;height:100vh;z-index:20;
  display:flex;flex-direction:column;color:#e9effb;
  background:linear-gradient(180deg,rgba(15,25,48,.96),rgba(10,18,38,.96));
  box-shadow:4px 0 26px -12px rgba(12,22,44,.55);border-right:1px solid rgba(140,175,235,.08)}
.sidebar::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(300px 200px at 20% -10%,rgba(90,160,255,.14),transparent 60%)}
.brand{display:flex;align-items:center;gap:12px;padding:24px 18px 16px}
.brand .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(135deg,#2e6df0,#3f9e7d);box-shadow:0 8px 20px -6px rgba(46,109,240,.5)}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.02em}
.brand p{font-size:10px;opacity:.55;letter-spacing:.22em;margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:6px 12px 14px}
.nav::-webkit-scrollbar{width:5px}.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px}
.nav-sep{font-size:10px;letter-spacing:.18em;opacity:.4;padding:16px 10px 6px}
.navi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;margin-bottom:2px;
  color:#b9c6e2;font-size:13.5px;text-decoration:none;transition:background .15s}
.navi:hover{background:rgba(255,255,255,.06);color:#eef3ff}
.navi.active{background:linear-gradient(90deg,rgba(46,109,240,.32),rgba(46,109,240,.12));color:#fff;font-weight:700;
  box-shadow:inset 2px 0 0 #5ab2ff}
.navi svg{width:16px;height:16px;opacity:.9}
.foot{padding:14px 16px;border-top:1px solid rgba(140,175,235,.1);font-size:12px}
.foot .fu{display:flex;align-items:center;gap:8px;color:#dbe4f5}
.foot .dot{width:8px;height:8px;border-radius:50%;background:#3ec189;box-shadow:0 0 0 3px rgba(62,193,137,.18)}
.foot .flog{margin-top:8px;opacity:.55;background:none;border:none;color:inherit;cursor:pointer;font-size:11.5px}
.foot .flog:hover{opacity:1;text-decoration:underline}

.main{flex:1;min-width:0;padding:20px 28px 90px}
.inner{max-width:960px;margin:0 auto}

/* ---- HUD ---- */
.hud{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin:2px 0 14px;flex-wrap:wrap}
.hud-pill{display:flex;align-items:center;gap:9px;padding:7px 13px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow-card);backdrop-filter:blur(14px);font-size:12.5px}
.hud-pill b{font-variant-numeric:tabular-nums}
.xpbar{width:92px;height:6px;border-radius:4px;background:rgba(90,110,150,.14);overflow:hidden}
.xpbar i{display:block;height:100%;width:62%;border-radius:4px;background:linear-gradient(90deg,var(--accent-deep),#5ab2ff);transition:width .4s ease}
.hud-gold{color:#a86f0e}
.hud-ava{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;cursor:pointer;
  border:2px solid #fff;box-shadow:0 0 0 2px var(--accent),var(--shadow-float);
  background:linear-gradient(135deg,#33415f,#1b2742);color:#fff;font-weight:800;font-size:14px}
.hud-ava .lv{position:absolute;bottom:-5px;right:-5px;background:var(--accent);color:#fff;font-size:9px;
  padding:1px 5px;border-radius:999px;border:2px solid #fff;font-weight:800}
.hud-ava.low{box-shadow:0 0 0 2px var(--ink-3)}
.guest-btn{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line-2);background:transparent;
  color:var(--ink-2);font-size:11.5px;padding:7px 11px;border-radius:999px;cursor:pointer;transition:all .15s}
.guest-btn.on{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.monster-pill{cursor:pointer;transition:transform .15s}
.monster-pill:hover{transform:translateY(-1px);box-shadow:var(--shadow-float)}
.monster-pill .ib{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:13px;
  background:linear-gradient(135deg,#3b2b55,#221a3d);color:#d9b8ff}

/* ---- 视图切换器 + 筛选 ---- */
.axis{display:flex;align-items:center;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.vtabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;
  backdrop-filter:blur(10px);box-shadow:var(--shadow-card)}
.vtab{border:none;background:transparent;cursor:pointer;border-radius:999px;padding:7px 16px;font-size:13px;
  color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:all .15s;font-weight:600}
.vtab.on{background:var(--accent);color:#fff;box-shadow:0 6px 16px -6px rgba(46,109,240,.55)}
.axis-note{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:12.5px;
  padding:6px 13px;border-radius:999px;cursor:pointer;transition:all .15s;backdrop-filter:blur(8px)}
.fchip:hover{border-color:var(--accent);color:var(--accent)}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 6px 16px -6px rgba(46,109,240,.55)}

/* ================= 视图 A：鱼骨时间线 ================= */
.fb{position:relative;padding:8px 0 4px}
.fb-spine{position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);
  background:linear-gradient(180deg,var(--line-2),rgba(90,110,150,.05));border-radius:3px;z-index:0}
.fb-day{position:relative;z-index:1;margin:2px 0 26px;display:grid;grid-template-columns:1fr 0 1fr;align-items:center}
/* 鱼脊关节锚点（时间刻度） */
.fb-anchor{grid-column:2;justify-self:center;display:flex;align-items:center;gap:8px;flex-direction:column;
  background:var(--card-solid);border:1px solid var(--line);border-radius:999px;padding:7px 16px;
  box-shadow:var(--shadow-card);font-size:12.5px;font-weight:700;white-space:nowrap;z-index:2}
.fb-anchor .fm{font-variant-numeric:tabular-nums}
.fb-anchor .fxp{font-size:10.5px;color:var(--ink-3);font-weight:500;font-family:var(--mono)}
.fb-anchor .fdate{font-size:10px;color:var(--ink-3);font-weight:500}
/* 连续打卡绿段：进入打卡日的脊段染绿 */
.fb-day.is-checkin .fb-spine-seg{position:absolute;right:50%;top:-15px;right:calc(50% - 1px);width:2px;height:15px;
  background:transparent}
.fb-day:nth-child(1){margin-top:6px}
/* 鱼刺：左右交替 */
.fb-branches{grid-column:1 / -1;grid-row:1;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.fb-branch{position:relative;max-width:calc(50% - 46px)}
.fb-branch.L{justify-self:start;text-align:right}
.fb-branch.R{justify-self:end;text-align:left}
.fb-branch::after{content:"";position:absolute;top:16px;width:26px;height:2px;background:var(--line-2);z-index:0}
.fb-branch.L::after{right:-26px}
.fb-branch.R::after{left:-26px}
.fb-node{position:relative;z-index:1;display:inline-flex;align-items:center;gap:9px;max-width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;
  box-shadow:var(--shadow-card);backdrop-filter:blur(8px);transition:transform .15s,box-shadow .15s;text-align:left}
.fb-node:hover{transform:translateY(-1px);box-shadow:var(--shadow-float)}
.fb-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 4px var(--abg),0 0 10px var(--abg)}
.fb-title{font-size:12.8px;font-weight:600;line-height:1.4}
.fb-xp{margin-left:2px;font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--accent-deep);
  background:var(--accent-soft);padding:1px 7px;border-radius:999px;white-space:nowrap}
.fb-xp.gold{color:#a86f0e;background:rgba(168,111,14,.12)}
.fb-detail{overflow:hidden;max-height:0;opacity:0;transition:max-height .25s ease,opacity .2s;font-size:12px;
  color:var(--ink-2);line-height:1.7;background:rgba(255,255,255,.6);border:1px dashed var(--line-2);
  border-radius:10px;padding:0 12px;margin-top:6px}
.fb-branch.open .fb-detail{max-height:160px;opacity:1;padding:10px 12px}
.fb-detail .mt{display:flex;gap:8px;margin-top:6px;font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.fb-detail .cat{background:rgba(90,110,150,.08);padding:1px 8px;border-radius:999px}
.fb-more{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent-deep);background:var(--accent-soft);
  border:1px solid rgba(46,109,240,.16);border-radius:999px;padding:6px 13px;cursor:pointer;text-align:left}
/* 豁免日记：灰色虚线 */
.fb-node.excuse{border-style:dashed;border-color:var(--line-2);background:rgba(120,130,150,.06)}
.fb-node.excuse .fb-dot{background:#9aa7bd;box-shadow:0 0 0 4px rgba(154,167,189,.15),0 0 8px rgba(154,167,189,.3)}
/* 类型色 */
.t-journal .fb-dot{background:var(--t-journal);box-shadow:0 0 0 4px color-mix(in srgb,var(--t-journal) 14%,transparent),0 0 10px color-mix(in srgb,var(--t-journal) 45%,transparent)}
.t-note   .fb-dot{background:var(--t-note);box-shadow:0 0 0 4px color-mix(in srgb,var(--t-note) 14%,transparent),0 0 10px color-mix(in srgb,var(--t-note) 45%,transparent)}
.t-plan   .fb-dot{background:var(--t-plan);box-shadow:0 0 0 4px color-mix(in srgb,var(--t-plan) 14%,transparent),0 0 10px color-mix(in srgb,var(--t-plan) 45%,transparent)}
.t-checkin .fb-dot{background:var(--t-checkin);box-shadow:0 0 0 4px color-mix(in srgb,var(--t-checkin) 14%,transparent),0 0 10px color-mix(in srgb,var(--t-checkin) 45%,transparent)}
.t-ledger .fb-dot{background:var(--t-ledger);box-shadow:0 0 0 4px color-mix(in srgb,var(--t-ledger) 14%,transparent),0 0 10px color-mix(in srgb,var(--t-ledger) 45%,transparent)}
.t-goal   .fb-dot{background:var(--t-goal);box-shadow:0 0 0 4px color-mix(in srgb,var(--t-goal) 14%,transparent),0 0 10px color-mix(in srgb,var(--t-goal) 45%,transparent)}
/* 接合：节点浮 +XP 微标（由 JS 附着） */
.empty-state{text-align:center;padding:60px 0;color:var(--ink-3);font-size:13.5px}
.empty-state .emoj{font-size:34px;display:block;margin-bottom:10px;opacity:.8}

/* ================= 视图 B：节点宇宙（仿 3D） ================= */
.uni{position:relative;border-radius:20px;overflow:hidden;user-select:none;touch-action:none;
  background:radial-gradient(560px 420px at 50% 42%,rgba(46,109,240,.12),transparent 62%),
  linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.25));
  border:1px solid var(--line);box-shadow:inset 0 0 60px rgba(46,109,240,.05),var(--shadow-card);
  backdrop-filter:blur(6px)}
.uni svg{display:block;width:100%;height:auto;cursor:grab}
.uni.dragging svg{cursor:grabbing}
.uni .uni-hint{position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--ink-3);pointer-events:none}
.uni .uni-center{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.uni .uni-ava{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:34px;
  background:linear-gradient(135deg,#33415f,#1b2742);color:#fff;box-shadow:0 0 0 5px rgba(46,109,240,.14),0 14px 40px -10px rgba(16,26,48,.4)}
.uni .uni-name{font-size:13px;font-weight:800;margin-top:10px}
.uni .uni-sub{font-size:11px;color:var(--ink-3);margin-top:3px}
.uni-detail{position:absolute;left:50%;bottom:16px;transform:translate(-50%,10px);width:min(420px,86%);
  background:var(--card-solid);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-float);
  padding:14px 16px;opacity:0;pointer-events:none;transition:all .25s}
.uni-detail.on{opacity:1;transform:translate(-50%,0)}
.uni-detail .uh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:4px}
.uni-detail .udot{width:10px;height:10px;border-radius:50%}
.uni-detail .us{font-size:12px;color:var(--ink-2);line-height:1.7}
.uni-detail .um{margin-top:6px;font-size:11px;color:var(--ink-3);font-family:var(--mono)}

/* ================= 速记居中弹窗 ================= */
.dmask{position:fixed;inset:0;z-index:70;background:rgba(16,26,48,.30);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .2s}
.dmask.on{opacity:1;pointer-events:auto}
.nmodal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);z-index:80;width:min(540px,92vw);
  background:var(--card-solid);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-float);
  padding:22px 24px;display:flex;flex-direction:column;gap:12px;opacity:0;pointer-events:none;transition:all .24s}
.nmodal.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.nmodal h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.nmodal h3 .kick{font-size:11px;color:var(--ink-3);font-weight:500;margin-left:auto}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;
  font-size:13.5px;font-family:inherit;background:#fff;outline:none;color:var(--ink)}
textarea{min-height:96px;resize:vertical;line-height:1.7}
textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.nrow{display:flex;gap:10px}
.nrow select{flex:1}
.type-pills{display:flex;gap:6px;flex-wrap:wrap}
.tpill-opt{border:1px solid var(--line);background:#fff;color:var(--ink-2);font-size:12px;padding:5px 12px;
  border-radius:999px;cursor:pointer;transition:all .12s}
.tpill-opt.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.nactions{display:flex;gap:10px;margin-top:2px}
.btn{flex:1;border:none;border-radius:12px;padding:11px 0;font-size:14px;font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,#2e6df0,#1b4fa0);color:#fff;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}

/* ---- 头像弹层 / 成就 / 战斗 ---- */
.popover{position:fixed;z-index:90;width:300px;border-radius:16px;padding:18px;background:var(--card-solid);
  border:1px solid var(--line);box-shadow:var(--shadow-float);display:none}
.popover.on{display:block}
.popover .ph{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.popover .big-ava{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,#33415f,#1b2742);color:#fff;font-size:22px;font-weight:800}
.popover .pn{font-size:15px;font-weight:800}
.popover .pt{font-size:12px;color:var(--ink-3);margin-top:2px}
.attr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.attr div{background:rgba(90,110,150,.06);border:1px solid var(--line);border-radius:10px;padding:9px 0;text-align:center}
.attr .k{font-size:10.5px;color:var(--ink-3);display:block}
.attr .v{font-size:16px;font-weight:800;font-family:var(--mono);display:block;margin-top:2px}
.skins{display:flex;gap:8px}
.skin{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;cursor:pointer;
  border:1.5px solid var(--line);background:#fff;transition:all .12s}
.skin:hover{border-color:var(--accent);transform:translateY(-1px)}
.skin.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.popover .note{font-size:11px;color:var(--ink-3);margin-top:12px;line-height:1.6}
.ach-pop{position:fixed;z-index:95;right:24px;top:78px;width:320px;padding:16px 18px;border-radius:14px;
  background:var(--card-solid);border:1px solid var(--line);box-shadow:var(--shadow-float);
  transform:translateY(-8px);opacity:0;pointer-events:none;transition:all .22s}
.ach-pop.on{opacity:1;transform:translateY(0)}
.ach-pop h4{font-size:13px;font-weight:800;margin-bottom:10px}
.ach-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ach{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:rgba(90,110,150,.05);
  display:grid;place-items:center;font-size:18px;color:var(--ink-3);cursor:pointer}
.ach.has{color:var(--accent-deep);background:var(--accent-soft);border-color:rgba(46,109,240,.28)}
.ach.un{filter:grayscale(1);opacity:.38}
.fab{position:fixed;right:26px;bottom:26px;z-index:40;display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#2e6df0,#1b4fa0);color:#fff;border:none;cursor:pointer;
  padding:13px 20px;border-radius:999px;font-size:14px;font-weight:700;
  box-shadow:0 16px 40px -12px rgba(27,79,160,.6);transition:transform .15s}
.fab:hover{transform:translateY(-2px)}
.float-xp{position:fixed;z-index:99;pointer-events:none;font-family:var(--mono);font-size:13px;font-weight:800;
  color:var(--accent-deep);animation:floatUp .95s ease-out forwards}
.float-xp.gold{color:#a86f0e}
@keyframes floatUp{0%{opacity:0;transform:translateY(4px)}18%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,14px);z-index:99;opacity:0;
  padding:10px 18px;border-radius:999px;font-size:13px;color:#fff;background:rgba(18,28,52,.92);
  box-shadow:var(--shadow-float);transition:all .25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:860px){.sidebar{display:none}.main{padding:16px 14px 90px}
  .fb-branch{max-width:calc(50% - 34px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></div>
      <div><h1>云笺集</h1><p>CLOUDLETTER</p></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div class="fu"><span class="dot"></span><span id="footUser">云上旅人 · 云笺集</span></div>
      <button class="flog" id="footLogout" style="display:none">退出登录</button>
    </div>
  </aside>

  <div class="main">
    <div class="inner">

      <!-- HUD -->
      <div class="hud">

/* ================= 数据 ================= */
const TYPES = [

  ['checkin','习惯','#059669'],['ledger','记账','#DC2626'],['goal','目标','#0E7490'],

const TYPE_DESC = { journal:'文章 / 长日志', note:'灵感 / 碎片', plan:'今日计划完成', checkin:'习惯打卡', ledger:'一笔记录', goal:'目标进度' };
const CELL_MAX = 5; // 密度控制：>5 折叠

const days = [

    items:[

      { t:'note',    title:'灵感 · 双视图的正确性', sub:'鱼骨找东西，宇宙感受沉淀。', tags:'设计', xp:10, pub:true },

/* ================= 全局状态 ================= */
let curType='all', view='fish', guest=false;
const store = { fish:{type:'all',scroll:0}, uni:{rotate:0,zoom:1} };

/* ================= 视图 A：鱼骨 ================= */
function nodeHTML(it,i){
  const t = it.excuse ? 'excuse' : it.t;
  const multi = i>0; // 同天多条时上下错开（堆叠展示 + 顺序编号感知）
  const dots = `<span class="fb-dot"></span>`;
  const xp = it.xp ? `<span class="fb-xp">+${it.xp} XP</span>` : it.gold ? `<span class="fb-xp gold">+${it.gold} 金币</span>` : '';
  const tag = (it.tags?`<span><span class="cat">#${it.tags}</span></span>`:'');
  const detail = `<span class="fb-detail">
      ${it.sub||''}
      <span class="mt">${TYPE_MAP[it.t] ? TYPE_MAP[it.t]+' · '+TYPE_DESC[it.t] : '豁免 · 自我辩解'}<span class="dot-sep" style="color:var(--ink-3)">·</span>${it.d}${tag}</span>
    </span>`;
  const g = it.excuse ? ' gray 虚线豁免' : '';
  return `<div class="fb-node t-${it.excuse?'excuse':it.t}" data-tt="${it.t}">
      ${dots}<span>${it.title}</span>${xp}${detail}
    </div>`;
}
function dayBranch(di, day){
  let items = day.items;
  if (curType!=='all') items = items.filter(x=>x.t===curType || (curType==='checkin'&&x.ach));
  const guestF = guest?items.filter(x=>x.pub!==false):items; // 无 pub 标记 = 私密 -> 游客不可见（演示）
  if (guest) items = guestF;
  if (!items.length) return '';
  const hasCheckin = day.items.some(x=>x.t==='checkin');
  let html = '';
  items.slice(0,CELL_MAX).forEach((it,i)=>{
    const side = (di+i)%2===0 ? 'L' : 'R';
    html += `<div class="fb-branch ${side}">${nodeHTML(it)}</div>`;
  });
  html += `
    <div class="fb-branch ${(items.length%2===0)?'L':'R'}">
      <button class="fb-more" type="button">☰ 当日 ${items.length} 条 · 展开全部</button>
    </div>`;
  return `
    <div class="fb-day${hasCheckin?' is-checkin':''}" data-di="${di}">
      <div class="fb-anchor">
        <span class="fm">${day.d}</span>
        <span class="fdate">${day.date}</span>
        <span class="fxp">+${day.xp} XP</span>
      </div>
      <div class="fb-branches">${html}</div>
    </div>`;
}
function renderFish(){
  const box = document.getElementById('viewFish');
  let body = days.map((day,di)=>dayBranch(di,day)).join('');
  box.innerHTML = `<div class="fb">${body||'<div class="empty-state"><span class="emoj">🌊</span>当前筛选下暂无记录</div>'}</div>`;
}
document.getElementById('viewFish').addEventListener('click', e=>{
  const b = e.target.closest('.fb-node');
  if (b){ b.closest('.fb-branch').classList.toggle('open'); return; }
  const more = e.target.closest('.fb-more');
  if (more){
    const day = more.closest('.fb-day');
    const di = +day.dataset.di;
    // 展开当天全部条目
    let items = days[di].items.filter(x=> curType==='all' || x.t===curType);
    if (guest) items = items.filter(x=>x.pub!==false);
    const add = items.slice(CELL_MAX).map((it,i)=>{
      const side = (i%2)?'L':'R';
      return `<div class="fb-branch ${side}">${nodeHTML(it)}</div>`;
    }).join('');
    day.querySelector('.fb-branches').insertAdjacentHTML('beforeend', add);
    more.parentElement.remove();
  }
});

/* ================= 视图 B：节点宇宙（仿 3D SVG） ================= */
let uniR = 0, uniZ = 1; // 旋转角 / 缩放
let uniDrag = null;
const U = { rx: 260, ry: 150, cx: 480, cy: 320, days: 6 };
function uniItems(){
  const all = [];
  days.forEach((day,di)=>{
    let its = day.items.filter(x=> curType==='all' ? true : x.t===curType);
    if (guest) its = its.filter(x=>x.pub!==false);
    its.forEach((it,i)=>{
      const t = it.t;
      const base = Math.PI * (i / (its.length+1)) - Math.PI/2; // 每日扇区
      all.push({ it, di, base, t: t==='excuse'?'excuse':t });
    });
  });
  return all;
}
function renderUni(){
  const box = document.getElementById('viewUni');
  const items = uniItems();
  if (!items.length){ box.innerHTML = `<div class="uni"><div class="empty-state" style="padding:60px 0">太空空空如也</div></div>`; return; }
  let nodes = '';
  items.forEach(n=>{
    const ring = U.days - n.di;                    // 越近越大/亮
    const R = (1.15 - n.di * 0.13) * U.rx;
    const ry = (1.15 - n.di * 0.13) * U.ry;
    const ox = (n.di%2===0?-1:1) * 30;             // 每日错开，避免重叠
    const a = n.base + uniR;
    const x = U.cx + Math.cos(a)*R + ox*Math.cos(a)*0.25;
    const y = U.cy + Math.sin(a)*ry + ox*Math.sin(a)*0.1;
    const size = 7 + (U.days - n.di) * 1.4;
    const col = n.t==='excuse' ? '#9aa7bd' : (TYPES.find(t=>t[0]===n.t)?.[2] || '#5b6b84');
    const date = days[n.di].d;
    nodes += `<circle cx="${x}" cy="${y}" r="${size}" fill="${col}"
      data-di="${n.di}" data-i="${items.indexOf(n)}"
      opacity="${0.45 + (U.days-n.di)*0.1}" stroke="#fff" stroke-width="${1.2+(U.days-n.di)*0.3}">
      <title>${date} · ${n.it.title}</title></circle>`;
  });
  box.innerHTML = `
    <div class="uni" id="uniBox">
      <svg id="uniSvg" viewBox="0 0 960 640">
        <g transform="translate(480 320) scale(${uniZ}) translate(-480 -320)">
          ${[0.42,0.66,0.9].map(s=>`<ellipse cx="${U.cx}" cy="${U.cy}" rx="${U.rx*s}" ry="${U.ry*s}" fill="none" stroke="rgba(90,110,150,.12)" stroke-dasharray="3 6"/>`).join('')}
          ${nodes}
        </g>
      </svg>
      <div class="uni-hint">拖拽旋转 · 滚轮缩放 · 双击聚焦近期 · 点击节点看详情</div>
      <div class="uni-detail" id="uniDl"></div>
    </div>`;
  wireUni();
}
function wireUni(){
  const svg = document.getElementById('uniSvg');
  const box = document.getElementById('uniBox');
  svg.addEventListener('pointerdown', e=>{ uniDrag = { x:e.clientX }; box.classList.add('dragging'); svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', e=>{ if(!uniDrag) return; uniR += (e.clientX - uniDrag.x)*0.012; uniDrag.x = e.clientX; renderUni(); });
  svg.addEventListener('pointerup', ()=>{ uniDrag=null; box.classList.remove('dragging'); });
  svg.addEventListener('wheel', e=>{ e.preventDefault(); uniZ = Math.min(1.6, Math.max(0.6, uniZ + (e.deltaY<0?0.08:-0.08))); renderUni(); }, {passive:false});
  svg.addEventListener('dblclick', e=>{ uniZ = Math.min(uniZ+0.3,1.5); renderUni(); });
  svg.addEventListener('click', e=>{
    const c = e.target.closest('circle'); if(!c) return;
    const n = uniItems()[+c.dataset.i]; if(!n) return;
    const dl = document.getElementById('uniDl');
    const col = n.t==='excuse' ? '#9aa7bd' : (TYPES.find(t=>t[0]===n.t)?.[2] || '#5b6b84');
    dl.innerHTML = `
      <div class="uh"><span class="udot" style="background:${col}"></span>${n.it.title}</div>
      <div class="us">${n.it.sub||TYPE_DESC[n.it.t]||'豁免 · 自我辩解'}</div>
      <div class="um">${days[n.di].d} · ${TYPE_MAP[n.it.t]||'豁免日记'}</div>`;
    dl.classList.add('on');
    setTimeout(()=>dl.classList.remove('on'), 3600);
  });
}

/* ================= 视图切换 + 状态保留 ================= */
function setView(v){
  if (v===view) return;
  if (view==='fish') store.fish = { type:curType, scroll: scrollY };
  if (view==='uni') store.uni = { rotate:uniR, zoom:uniZ };
  view = v;
  document.getElementById('vFish').classList.toggle('on', v==='fish');
  document.getElementById('vUni').classList.toggle('on', v==='uni');
  document.getElementById('viewFish').style.display = v==='fish'?'':'none';
  document.getElementById('viewUni').style.display = v==='uni'?'':'none';
  document.getElementById('axisNote').textContent = v==='fish' ? '鱼骨找东西 · 宇宙感受沉淀 · 同一份数据两种渲染' : '中心是你的化身 · 外圈是最近的沉淀';
  if (v==='fish'){ curType = store.fish.type; uniR=store.uni.rotate; uniZ=store.uni.zoom; renderChips(); renderFish(); requestAnimationFrame(()=>scrollTo(0, store.fish.scroll)); }
  else { renderUni(); }
}

document.getElementById('vUni').addEventListener('click', ()=>setView('uni'));

const hud = { xp:620, xpMax:1000, lv:4, gold:1280 };
function setHud(){
  document.getElementById('hudLev').textContent = `LV ${hud.lv}`;
  document.getElementById('avaLv').textContent = hud.lv;
  document.getElementById('hudXpTxt').textContent = `${hud.xp} / ${hud.xpMax} XP`;
  document.getElementById('hudXpBar').style.width = Math.min(100,hud.xp/hud.xpMax*100)+'%';
  document.getElementById('hudGold').textContent = hud.gold.toLocaleString();
}
function gain(amount, anchor){
  hud.xp = Math.min(hud.xpMax, hud.xp+amount); setHud();
  float(amount, false, anchor);
}
function gainGold(n){ hud.gold += n; setHud(); float(n, true, document.getElementById('fabBtn')); }
function float(amount, gold, anchor){
  const r = (anchor?.getBoundingClientRect()) ?? { right: innerWidth/2, top: innerHeight/2 };
  const el = document.createElement('span');
  el.className = 'float-xp'+(gold?' gold':''); el.textContent = `+${amount} ${gold?'金币':'XP'}`;
  el.style.left = (r.right-40)+'px'; el.style.top = (r.top-10)+'px';
  document.body.appendChild(el); setTimeout(()=>el.remove(),1000);
}
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('on'),2200);
}

/* ================= 头像/成就/战斗/游客（沿用） ================= */
const popover = document.getElementById('popover');
document.getElementById('avaBtn').addEventListener('click', e=>{
  e.stopPropagation();
  const r = e.currentTarget.getBoundingClientRect();
  popover.style.right = (innerWidth-r.right+8)+'px'; popover.style.top = (r.bottom+10)+'px';
  popover.classList.toggle('on');
});
document.getElementById('skins').addEventListener('click', e=>{
  const s = e.target.closest('.skin'); if(!s) return;
  document.querySelectorAll('.skin').forEach(x=>x.classList.remove('on')); s.classList.add('on');
  document.getElementById('avaEmoji').textContent = s.textContent;
  document.getElementById('bigAva').textContent = s.textContent;
  toast(`已换装 · ${s.textContent}`);
});
document.addEventListener('click', e=>{
  if(!e.target.closest('#popover') && !e.target.closest('#avaBtn')) popover.classList.remove('on');
  if(!e.target.closest('#achPop') && !e.target.closest('#achBtn')) document.getElementById('achPop').classList.remove('on');
  if(!e.target.closest('#battlePop') && !e.target.closest('#monsterBtn')) document.getElementById('battlePop').classList.remove('on');
});
const achList = [['🎯','连击 7 天',true],['🔥','连击 30 天',true],['💯','连击 100 天',false],
  ['📝','首条记录',true],['📚','发布 3 篇文章',true],['🥞','首笔记账',true],
  ['⚔️','击败首怪',true],['🌟','LV 10',false],['👑','3 枚称号',false]];
document.getElementById('achBtn').addEventListener('click', ()=>document.getElementById('achPop').classList.toggle('on'));
document.getElementById('achGrid').innerHTML = achList.map(([e,n,un])=>`<div class="ach${un?' has':' un'}" title="${n}">${e}</div>`).join('');
let win = false;
document.getElementById('monsterBtn').addEventListener('click', ()=>{
  const b = document.getElementById('battlePop');
  const r = document.getElementById('monsterBtn').getBoundingClientRect();
  b.style.right = (innerWidth-r.right+8)+'px'; b.style.top = (r.bottom+10)+'px';
  b.classList.toggle('on'); document.getElementById('bRes').textContent='';
});
document.getElementById('bGo').addEventListener('click', ()=>{
  if(win) return;
  const res = document.getElementById('bRes');
  res.innerHTML = '⚔️ 结算中…';
  setTimeout(()=>{
    const won = Math.random() > 0.42;
    if(won){ win = true;
      const gold = Math.random()>0.5;
      res.style.color='var(--ok)';
      res.innerHTML = gold? '胜利 · 掉落 🪙 +80 金币' : '胜利 · 掉落装备「🗡 木剑」';
      if(gold) gainGold(80); else toast('获得装备「木剑」（属性 +2 ATK）');
      float(40,false,document.getElementById('monsterBtn'));
      achList[6][2]=true;
    } else { res.style.color='var(--warn)'; res.innerHTML='惜败… 零惩罚，锻炼后再来。'; }
  },900);
});
document.getElementById('guestBtn').addEventListener('click', e=>{
  guest = !guest;
  e.currentTarget.classList.toggle('on', guest);
  document.getElementById('avaBtn').classList.toggle('low', guest);
  if(guest){
    document.getElementById('hudLev').textContent='LV 1'; document.getElementById('avaLv').textContent='1';
    document.getElementById('hudXpBar').style.width='8%';
    document.getElementById('hudXpTxt').textContent='0 / 100 XP（初始态）';
    document.getElementById('hudGold').textContent='0';
    document.getElementById('avaEmoji').textContent='🙂'; document.getElementById('bigAva').textContent='🙂';
    document.getElementById('avoName').textContent='游客';
    document.getElementById('footUser').textContent='游客 · 初始态';
    toast('游客视角：仅展示公开条目 · HUD 演示壳');
  } else {
    setHud();
    document.getElementById('avaEmoji').textContent='🧙'; document.getElementById('bigAva').textContent='🧙';
    document.getElementById('avoName').textContent='云上旅人';
    document.getElementById('footUser').textContent='云上旅人 · 云笺集';
    toast('已切回本人视角');
  }
  renderFish(); renderUni();
});

/* ================= 启动 ================= */
renderNav(); renderNoteTypes(); renderChips(); renderFish(); setHud();
</script>
