<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.svg?v=2" />
  <title>拾光集 · 导航</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#FAF9F6; --panel:#FFFFFF; --panel2:#F3F1EC; --fg:#1A1A1A; --muted:#6E6A63;
      --accent:#C2402A; --accent-deep:#9C2F1D; --accent-soft:#FBEEE9;
      --border:#E8E4DC; --border-strong:#D5D0C6;
      --serif:'Playfair Display','Noto Serif SC','Songti SC','SimSun',serif;
      --sans:'Inter','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,sans-serif;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;background:var(--bg);color:var(--fg);min-height:100vh;
      font-family:var(--sans);line-height:1.75;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    a{color:inherit;text-decoration:none}
    ::selection{background:var(--accent);color:#fff}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

    /* 顶栏 */
    header{
      position:sticky;top:0;z-index:40;display:flex;align-items:center;
      height:60px;padding:0 clamp(16px,4vw,40px);
      background:rgba(250,249,246,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
    }
    .brand{display:flex;align-items:baseline;gap:9px;font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:.02em}
    .brand:hover{color:var(--accent)}
    .brand small{font-family:var(--sans);font-size:10px;letter-spacing:.28em;color:var(--muted);font-weight:500;text-transform:uppercase}
    .count{margin-left:auto;font-size:12px;color:var(--muted);letter-spacing:.06em}

    .wrap{max-width:760px;margin:0 auto;padding:0 20px 70px}

    /* Hero：极简编辑标题 */
    .hero{padding:64px 16px 40px;text-align:center}
    .kicker{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
    .hero h1{
      font-family:var(--serif);font-weight:600;margin:0;line-height:1.12;
      font-size:clamp(34px,6vw,52px);letter-spacing:.01em;
    }
    .hero .sub{color:var(--muted);font-size:15px;margin:14px 0 0}

    /* 入口列表：编辑列表行 */
    .feed{border-top:1px solid var(--border)}
    .row{
      position:relative;display:flex;align-items:center;gap:18px;
      padding:22px 8px;border-bottom:1px solid var(--border);transition:.2s;
    }
    .row::before{
      content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);
      transform:scaleY(0);transform-origin:center;transition:transform .2s ease;
    }
    .row:hover{background:linear-gradient(90deg,var(--accent-soft),transparent 60%)}
    .row:hover::before{transform:scaleY(1)}
    .row .idx{flex:none;width:32px;font-family:var(--serif);font-style:italic;color:var(--border-strong);font-size:14px}
    .row .ic{
      flex:none;width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;
      border:1px solid var(--border);color:var(--accent);background:var(--panel);
    }
    .row .ic svg{width:21px;height:21px}
    .row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
    .row .name{font-family:var(--serif);font-size:clamp(17px,2.3vw,20px);font-weight:600;transition:.15s}
    .row:hover .name{color:var(--accent)}
    .row .desc{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
    .row .arrow{flex:none;color:var(--border-strong);display:flex;transition:.2s}
    .row .arrow svg{width:19px;height:19px}
    .row:hover .arrow{color:var(--accent);transform:translateX(4px)}

    footer{text-align:center;color:var(--muted);font-size:12.5px;letter-spacing:.06em;padding:38px 20px 46px;border-top:1px solid var(--border)}
    footer .sig{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--border-strong)}

    @media (prefers-reduced-motion:reduce){
      *{transition:none!important}
      html{scroll-behavior:auto}
    }
    @media(max-width:520px){
      .row{gap:13px;padding:19px 4px}
      .row .idx{display:none}
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/dev/" title="个人博客">拾光集<small>Index</small></a>
    <span class="count">1 entry</span>
  </header>

  <main class="wrap">
    <section class="hero">
      <p class="kicker">Collection · 收藏索引</p>
      <h1>拾光集</h1>
      <p class="sub">我的收藏与项目入口</p>
    </section>

    <nav class="feed" aria-label="站点导航">
      <a class="row" href="/dev/">
        <span class="idx">01</span>
        <span class="ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>
        </span>
        <span class="body">
          <span class="name">云笺集</span>
          <span class="desc">个人博客 · Markdown</span>
        </span>
        <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>
      </a></nav>
  </main>

  <footer>
    <div class="sig">拾光集 · Shiguang Journal</div>
  </footer>
</body>
</html>
